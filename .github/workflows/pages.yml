# admin001(루트)과 gtec001 졸업전시 가상 전시장(/hwangjiyoung/ — 황지영 교수님 선물용 주소, /gtec001/ 은 이쪽으로 넘김)을 한 Pages 사이트로 배포한다. main에 push하면 빌드 → Pages.
# 비밀값은 없다. Apps Script 웹 앱 주소는 저장소 Variables
# (Settings → Secrets and variables → Actions → Variables)에 VITE_API_URL 로 두면 빌드에 들어간다.
# 없으면 앱의 설정 화면에서 입력한다.
name: Deploy admin001 + gtec001 to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['admin001/**', '경기과학기술대학교/gtec001/site/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: admin001
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: admin001/package-lock.json
      - run: npm ci
      - run: npm run build
        env:
          VITE_BASE: /tjkim2/
          VITE_API_URL: ${{ vars.VITE_API_URL }}
      # 해시 라우터라 404.html 복제가 꼭 필요하진 않지만, 직접 주소 접근 시 index를 돌려준다.
      - run: cp dist/index.html dist/404.html
      # gtec001 — MOVE : 이소 가상 전시장. base 가 ./ 라 하위 경로 /tjkim2/gtec001/ 에서 그대로 동작한다.
      - name: Build gtec001 gallery
        working-directory: 경기과학기술대학교/gtec001/site
        run: |
          npm ci
          npm run build
          cp dist/index.html dist/404.html
      - name: Merge into one Pages artifact
        working-directory: .
        run: |
          mkdir -p admin001/dist/hwangjiyoung admin001/dist/gtec001
          cp -r 경기과학기술대학교/gtec001/site/dist/. admin001/dist/hwangjiyoung/
          # 예전 주소(/gtec001/)로 들어오면 새 주소로 넘긴다(해시 경로 유지)
          printf '%s' '<!doctype html><meta charset="utf-8"><script>location.replace("/tjkim2/hwangjiyoung/"+location.search+location.hash)</script>' > admin001/dist/gtec001/index.html
          cp admin001/dist/gtec001/index.html admin001/dist/gtec001/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: admin001/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
