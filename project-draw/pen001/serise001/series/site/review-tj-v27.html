<style>
@font-face{font-family:Nanum;src:url('../../web/fonts/NanumSquareRoundB.ttf');font-display:swap}*{box-sizing:border-box}body{margin:0;background:#222722;color:#e8e7dd;font-family:Nanum,system-ui,sans-serif}main{max-width:1400px;min-height:100dvh;margin:auto;display:grid;grid-template-columns:minmax(300px,1fr) 300px;gap:52px;padding:30px 54px;align-items:center}.paper{width:min(100%,calc((100dvh - 60px)*940/1672));margin:auto;position:relative;aspect-ratio:940/1672;box-shadow:0 18px 70px #0005;background:#f3efdf}canvas{display:block;width:100%;height:100%}#loading{position:absolute;inset:0;display:grid;place-items:center;color:#756b52;background:#f3efdf;font-size:14px}#loading[hidden]{display:none}aside{align-self:center}small{color:#c3ab7c;font-size:11px;letter-spacing:.18em}h1{font-size:33px;font-weight:400;line-height:1.35;margin:17px 0 13px}p{font-size:13px;line-height:1.9;color:#adb5a9;margin:0 0 28px}.buttons{display:flex;gap:9px;margin-bottom:18px;flex-wrap:wrap}button,select{font:inherit;font-size:13px;color:inherit;background:transparent;border:1px solid #626c5c;padding:10px 14px;border-radius:3px;cursor:pointer;min-height:40px}button:hover{background:#394035}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #d7be8e;outline-offset:4px}button.primary{background:#d2b384;color:#252b23;border-color:#d2b384}button:disabled{opacity:.5;cursor:wait}input[type=range]{width:100%;accent-color:#d2b384;margin:12px 0}output{font-size:12px;color:#c8cebf;font-variant-numeric:tabular-nums}label{font-size:12px;color:#bbc3b5}select{margin-left:12px;background:#222722;padding:7px 10px}input[type=checkbox]{accent-color:#d2b384;margin:0 8px 0 0}.options{display:flex;flex-wrap:wrap;align-items:center;gap:14px 20px;margin:24px 0}.strokes{border-top:1px solid #424b3d;margin-top:24px;padding-top:22px;display:flex;gap:7px;flex-wrap:wrap}.strokes button{font-size:11px;min-height:33px;padding:7px 9px}.strokes button.active{border-color:#d2b384;color:#d2b384}#stageName{display:block;min-height:26px;margin-top:9px}a{color:#c9b48d;text-decoration:none;font-size:12px}.review-note{margin-top:25px;font-size:11px;color:#88927f;line-height:1.8}footer{margin-top:28px}@media(max-width:850px){main{grid-template-columns:1fr;gap:25px;padding:18px 18px 35px}.paper{width:min(100%,calc((100dvh - 170px)*940/1672));min-width:240px}aside{width:min(100%,520px);margin:auto}h1{font-size:24px;margin:10px 0}p{margin-bottom:17px}.options{margin:15px 0}.strokes{margin-top:18px;padding-top:15px}}@media(prefers-reduced-motion:reduce){.paper{scroll-behavior:auto}}
</style></head><body><main>
<section class="paper" aria-label="Tj 붓글씨 미리보기"><canvas id="tjPreview" width="940" height="1672" aria-label="긴 대나무 붓이 Tj를 쓰는 모습"></canvas><div id="loading" role="status">붓과 먹을 준비하고 있습니다.</div></section>
<aside><small>TJ KIM · CALLIGRAPHY REVIEW</small><h1>길게 누르고,<br>가볍게 흘리다.</h1><p>붓끝을 가까이 따라가며 씁니다.<br>완성되면 전체 Tj를 보여줍니다.</p>
<div class="buttons"><button id="play" class="primary" disabled>재생</button><button id="replay" disabled>다시 쓰기</button><button id="complete" disabled>완성 보기</button></div>
<input id="timeline" type="range" min="0" max="8.4" step=".005" value="0" aria-label="붓글씨 재생 위치" disabled><output id="clock">0.0 / 8.4초</output><output id="stageName">붓을 들다</output>
<div class="options"><label>화면<select id="camera"><option value="closeup" selected>붓끝 클로즈업</option><option value="full">전체 글씨 고정</option></select></label><label><input id="showBrush" type="checkbox" checked>붓 표시</label><label>속도<select id="speed"><option value=".5">0.5배</option><option value="1" selected>1배</option><option value="1.5">1.5배</option></select></label></div>
<div id="strokes" class="strokes" aria-label="획별 보기"></div><p class="review-note">글씨와 붓의 움직임만 보는 별도 시안입니다.<br>기존 10편의 도입은 그대로 유지되어 있습니다.</p>
