<!doctype html><meta charset="utf-8"><pre id="status">시작</pre><script>
(async()=>{try{const c=document.createElement('canvas');c.width=1080;c.height=1920;const x=c.getContext('2d');x.fillStyle='#f8f5ea';x.fillRect(0,0,1080,1920);const gpu=new URLSearchParams(location.search).get('mode')==='gpu',d=gpu?null:x.getImageData(0,0,1080,1920).data,cfg={codec:'avc1.64002a',width:1080,height:1920,bitrate:10000000,framerate:30,latencyMode:'realtime',hardwareAcceleration:'prefer-hardware',avc:{format:'annexb'}};let count=0;const e=new VideoEncoder({output(){count++},error(x){throw x}});e.configure(cfg);const start=performance.now();for(let i=0;i<120;i++){const f=gpu?new VideoFrame(c,{timestamp:Math.round(i*1e6/30)}):new VideoFrame(d,{format:'RGBA',codedWidth:1080,codedHeight:1920,timestamp:Math.round(i*1e6/30)});e.encode(f,{keyFrame:i===0});f.close();while(e.encodeQueueSize>8)await new Promise(r=>e.addEventListener('dequeue',r,{once:true}));window.bench={i,count};document.getElementById('status').textContent=JSON.stringify(window.bench);}await e.flush();e.close();window.bench={seconds:(performance.now()-start)/1000,count,complete:true};document.getElementById('status').textContent=JSON.stringify(window.bench);}catch(e){window.bench={error:e.stack};document.getElementById('status').textContent=e.stack}})();
</script>
